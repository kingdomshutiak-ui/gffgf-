<title>Dévoilement</title>
<style>
  :root {
    --bg: #f6f1ea;
    --surface: #fffdfa;
    --surface-2: #efe7db;
    --ink: #2a211d;
    --ink-soft: #6b5f58;
    --ink-faint: #9a8f86;
    --accent: #8c2a3a;
    --accent-soft: #c98a87;
    --accent-wash: #f2e0dd;
    --border: #e3d8cc;
    --warn: #a1631f;
    --shadow: 0 1px 2px rgba(42, 33, 29, 0.06), 0 8px 24px -12px rgba(42, 33, 29, 0.18);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1b1613;
      --surface: #241e1a;
      --surface-2: #2d2621;
      --ink: #f3eae1;
      --ink-soft: #b7a99d;
      --ink-faint: #7d7168;
      --accent: #e2938c;
      --accent-soft: #a15a56;
      --accent-wash: #382422;
      --border: #3a302a;
      --warn: #d99b52;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px -12px rgba(0, 0, 0, 0.5);
    }
  }
  :root[data-theme="dark"] {
    --bg: #1b1613;
    --surface: #241e1a;
    --surface-2: #2d2621;
    --ink: #f3eae1;
    --ink-soft: #b7a99d;
    --ink-faint: #7d7168;
    --accent: #e2938c;
    --accent-soft: #a15a56;
    --accent-wash: #382422;
    --border: #3a302a;
    --warn: #d99b52;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px -12px rgba(0, 0, 0, 0.5);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .app {
    max-width: 640px;
    margin: 0 auto;
    height: 100dvh;
    display: flex;
    flex-direction: column;
  }

  /* ---------- Header / progress ---------- */
  .head {
    flex: none;
    padding: 14px 20px 12px;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
  }
  .head-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  .brand {
    font-family: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
    font-size: 1.05rem;
    letter-spacing: 0.01em;
    color: var(--ink);
  }
  .brand em { color: var(--accent); font-style: normal; }
  .step-label {
    font-size: 0.78rem;
    color: var(--ink-faint);
    font-variant-numeric: tabular-nums;
  }
  .bar {
    height: 4px;
    border-radius: 2px;
    background: var(--surface-2);
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 2px;
    transition: width 0.4s ease;
  }

  /* ---------- Chat log ---------- */
  .log {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 20px 20px 8px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  .msg-bot {
    max-width: 92%;
  }
  .msg-bot .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px 16px 16px 4px;
    padding: 16px 18px;
    box-shadow: var(--shadow);
  }
  .msg-bot .block-title {
    font-family: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
    font-size: 1.15rem;
    color: var(--accent);
    margin: 0 0 8px;
  }
  .msg-bot .block-num {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--ink-faint);
    display: block;
    margin-bottom: 4px;
  }
  .msg-bot ul {
    margin: 0;
    padding-left: 1.1em;
    color: var(--ink-soft);
    font-size: 0.95rem;
    line-height: 1.55;
  }
  .msg-bot ul li { margin-bottom: 4px; }
  .msg-bot ul li:last-child { margin-bottom: 0; }

  .msg-user {
    align-self: flex-end;
    max-width: 88%;
  }
  .msg-user .bubble {
    background: var(--accent);
    color: #fff8f6;
    border-radius: 16px 16px 4px 16px;
    padding: 12px 16px;
    font-size: 0.95rem;
    line-height: 1.5;
    white-space: pre-wrap;
    box-shadow: var(--shadow);
  }
  .msg-user .bubble.skipped {
    background: var(--surface-2);
    color: var(--ink-faint);
    font-style: italic;
  }

  /* ---------- Input dock ---------- */
  .dock {
    flex: none;
    border-top: 1px solid var(--border);
    background: var(--bg);
    padding: 12px 20px 16px;
  }
  .input-wrap {
    position: relative;
  }
  textarea {
    width: 100%;
    resize: none;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--surface);
    color: var(--ink);
    font: inherit;
    font-size: 0.95rem;
    padding: 12px 46px 12px 14px;
    line-height: 1.5;
    min-height: 64px;
    max-height: 200px;
  }
  textarea:focus {
    outline: none;
    border-color: var(--accent-soft);
  }
  .mic-btn {
    position: absolute;
    top: 8px;
    right: 8px;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: var(--surface-2);
    color: var(--ink-soft);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.95rem;
    transition: background 0.15s, color 0.15s;
  }
  .mic-btn:hover { color: var(--ink); }
  .mic-btn.recording {
    background: var(--accent);
    color: #fff8f6;
    animation: pulse 1.4s ease-out infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(140, 42, 58, 0.45); }
    70% { box-shadow: 0 0 0 9px rgba(140, 42, 58, 0); }
    100% { box-shadow: 0 0 0 0 rgba(140, 42, 58, 0); }
  }
  @media (prefers-reduced-motion: reduce) {
    .mic-btn.recording { animation: none; }
  }
  .mic-hint {
    font-size: 0.76rem;
    color: var(--accent);
    margin-top: 6px;
    display: none;
  }
  .mic-hint.show { display: block; }

  .dock-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-top: 10px;
  }
  .dock-row .left { display: flex; gap: 14px; }
  button {
    font: inherit;
    cursor: pointer;
    border: none;
    background: none;
  }
  .btn-primary {
    background: var(--accent);
    color: #fff8f6;
    padding: 10px 20px;
    border-radius: 999px;
    font-size: 0.92rem;
    font-weight: 600;
    transition: opacity 0.15s;
  }
  .btn-primary:disabled { opacity: 0.4; cursor: default; }
  .btn-primary:not(:disabled):hover { opacity: 0.9; }
  .btn-ghost {
    color: var(--ink-faint);
    font-size: 0.85rem;
    padding: 8px 4px;
  }
  .btn-ghost:hover { color: var(--ink-soft); }

  /* ---------- Intro / Summary screens ---------- */
  .screen {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 32px 24px;
    overflow-y: auto;
  }
  .screen .eyebrow {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--accent);
    margin-bottom: 10px;
  }
  .screen h1 {
    font-family: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
    font-size: 2rem;
    line-height: 1.2;
    margin: 0 0 16px;
    text-wrap: balance;
  }
  .screen p {
    color: var(--ink-soft);
    font-size: 1rem;
    line-height: 1.6;
    margin: 0 0 14px;
    max-width: 46ch;
  }
  .name-field {
    margin: 18px 0 24px;
  }
  .name-field label {
    display: block;
    font-size: 0.8rem;
    color: var(--ink-faint);
    margin-bottom: 6px;
  }
  .name-field input {
    width: 100%;
    max-width: 320px;
    font: inherit;
    font-size: 1rem;
    padding: 11px 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--ink);
  }
  .name-field input:focus { outline: none; border-color: var(--accent-soft); }

  .meta-row {
    display: flex;
    gap: 22px;
    margin: 4px 0 26px;
    flex-wrap: wrap;
  }
  .meta-item {
    font-size: 0.82rem;
    color: var(--ink-faint);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .meta-item .dot {
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--accent-soft);
  }

  .delivery-status {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.85rem;
    color: var(--ink-faint);
    margin: 2px 0 20px;
  }
  .delivery-status.ok { color: var(--accent); }
  .delivery-status.err { color: var(--warn); }
  .delivery-status button {
    color: inherit;
    text-decoration: underline;
    font-size: inherit;
  }

  .summary-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px 20px;
    max-height: 40vh;
    overflow-y: auto;
    margin-bottom: 20px;
    box-shadow: var(--shadow);
  }
  .summary-box h3 {
    font-family: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
    font-size: 0.98rem;
    color: var(--accent);
    margin: 16px 0 4px;
  }
  .summary-box h3:first-child { margin-top: 0; }
  .summary-box p {
    color: var(--ink-soft);
    font-size: 0.9rem;
    margin: 0 0 4px;
    white-space: pre-wrap;
  }
  .summary-box p.empty { color: var(--ink-faint); font-style: italic; }

  .actions {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }
  .btn-secondary {
    border: 1px solid var(--border);
    color: var(--ink);
    background: var(--surface);
    padding: 10px 18px;
    border-radius: 999px;
    font-size: 0.9rem;
    font-weight: 500;
  }
  .btn-secondary:hover { border-color: var(--accent-soft); }

  .toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--ink);
    color: var(--bg);
    padding: 9px 18px;
    border-radius: 999px;
    font-size: 0.85rem;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
    z-index: 20;
  }
  .toast.show { opacity: 1; }

  .hidden { display: none !important; }
</style>

<div class="app" id="app"></div>
<div class="toast" id="toast"></div>

<script>
(function () {
  "use strict";

  var WEBHOOK_URL = "https://n8n.instahak.online/webhook/devoilement-french-ken";

  var BLOCKS = [
    { title: "Histoire", prompts: [
      "Raconte ton histoire : comment étais-tu entre 15 et 20 ans ?",
      "Quelle relation t'a le plus transformé ?",
      "Quel événement a le plus influencé ta vision de l'amour, ou t'a amené à te consacrer à ce domaine ?",
      "Quelle a été l'expérience la plus douloureuse de tes relations ? Quelle leçon en as-tu tirée ?",
      "Quelle erreur personnelle apprécies-tu le plus aujourd'hui ?",
      "Quel moment a marqué un point de non-retour dans ta vie ?",
      "Qu'est-ce qui t'a le plus déçu dans les relations modernes ?"
    ]},
    { title: "Pourquoi (mission)", prompts: [
      "Pourquoi fais-tu précisément ce que tu fais ? Qu'est-ce qui te donne envie de te lever chaque matin ?",
      "Quelle injustice, quel problème de l'humanité veux-tu résoudre ?",
      "Qu'est-ce qui te met en colère dans l'industrie du dating ?",
      "Pourquoi ce sujet est-il si personnel pour toi ?",
      "Si tu n'avais plus jamais besoin de gagner de l'argent, continuerais-tu ce travail ?",
      "À quoi ressemblera le monde dans 30 ans si ta mission est accomplie ?"
    ]},
    { title: "Vision", prompts: [
      "Comment imagines-tu French Ken dans 10 ans ? Quel est ton plus grand rêve ?",
      "Si aucune limite n'existait, quelle marque voudrais-tu construire ?",
      "Qui devrait connaître ton nom ?"
    ]},
    { title: "Valeurs & convictions", prompts: [
      "Termine : Je crois que… / L'amour, c'est… / Un homme de qualité, c'est… / Une femme forte, c'est…",
      "Le plus grand mensonge sur les relations, c'est… Les gens se trompent quand ils pensent que…",
      "Quels sont les trois principes que tu ne trahiras jamais ?",
      "Quel comportement ne peux-tu pas tolérer ? Pourquoi les gens peuvent-ils te faire confiance ?",
      "Qui t'inspire le plus ?"
    ]},
    { title: "L'ennemi", prompts: [
      "Contre quoi te bats-tu ? Quel conseil considères-tu comme dangereux ?",
      "Qu'est-ce qui détruit le plus les relations modernes ? Quels mythes faut-il arrêter de répéter ?",
      "Qu'est-ce qui t'agace le plus dans le contenu d'autres experts en relations amoureuses ?"
    ]},
    { title: "Le public cible", prompts: [
      "Qui souhaites-tu aider avant tout ? À quoi ressemble la personne qui te suit ?",
      "Pourquoi pleure-t-elle la nuit ? Que tape-t-elle sur Google à deux heures du matin ?",
      "Quelle question n'ose-t-elle pas poser à ses amis ? Que cache-t-elle ? Sa plus grande peur, son plus grand désir ?"
    ]},
    { title: "Problèmes & transformation", prompts: [
      "Quels sont les dix problèmes les plus fréquents de ton audience ? Les questions les plus posées, les erreurs répétées ?",
      "Qui devient-elle après avoir travaillé avec toi ? Quelles phrases, habitudes ou croyances abandonne-t-elle ou adopte-t-elle ?"
    ]},
    { title: "Philosophie, unicité & archétype", prompts: [
      "Quels sont tes dix principes fondamentaux sur l'amour ? Les règles que tu ne transgresseras jamais ?",
      "Quelles sont les trois idées qui résument le mieux ton approche ?",
      "Pourquoi t'écouter toi plutôt qu'un autre ? Que sais-tu que la plupart des gens ignorent ?",
      "Si French Ken était une personne, quel serait son caractère ? Trois mots qui le décrivent ?",
      "Quelle émotion, quelle atmosphère la marque doit-elle créer ?"
    ]},
    { title: "Les émotions", prompts: [
      "Qu'est-ce qui te fait le plus souffrir ? De quoi as-tu peur, toi-même ?",
      "Pourquoi as-tu pleuré pour la dernière fois ?",
      "Quelle histoire de client n'oublieras-tu jamais ? Quand ressens-tu la plus grande fierté ?"
    ]},
    { title: "Le contenu", prompts: [
      "De quels sujets pourrais-tu parler pendant des heures ? Lesquels refuses-tu d'aborder ?",
      "Quel type de contenu détestes-tu ? Quel genre de vidéos aimerais-tu créer dans cinq ans ?"
    ]},
    { title: "Les produits", prompts: [
      "Que souhaites-tu vendre ? Formations en ligne, livre, cours, communauté, retraites de luxe, club de rencontres, application ?",
      "À quoi ressemble ton entreprise idéale ?"
    ]},
    { title: "L'héritage", prompts: [
      "Si Instagram disparaissait demain, que devrait-il rester de toi ?",
      "Dans 40 ans, un documentaire est consacré à ta vie — quel en serait le titre ? Que diraient les gens après l'avoir vu ?",
      "Quelle est l'unique idée, l'unique phrase que tu voudrais laisser à l'humanité ?"
    ]},
    { title: "La marque & positionnement", prompts: [
      "Pourquoi avoir choisi une vision française des relations amoureuses ? Sans le mot « French », que reste-t-il d'unique chez toi ?",
      "Quels sont les trois mots qui devraient venir à l'esprit lorsque les gens entendent ton nom ? En quoi te distingues-tu de Matthew Hussey, Jillian Turecki ou Stephan Speaks ?",
      "Dans 10 ans, si tu ne parles plus de messages, de « red flags » ou de rencontres, quelle grande idée restera au cœur de ton travail ?"
    ]},
    { title: "Ta vie amoureuse aujourd'hui", prompts: [
      "Es-tu en couple actuellement ? Comment se passe ta vie amoureuse aujourd'hui ?",
      "Appliques-tu toi-même tes propres principes ? Donne un exemple récent.",
      "Qu'est-ce que ta partenaire (ou ton célibat) t'apprend en ce moment ?"
    ]},
    { title: "Famille & racines", prompts: [
      "Comment était la relation de tes parents ? Qu'as-tu appris d'eux, ou juré de ne jamais répéter ?",
      "Quel rôle la famille joue-t-elle dans ta vision de l'amour aujourd'hui ?"
    ]},
    { title: "Vulnérabilité & échecs", prompts: [
      "Quel a été ton plus grand échec public ou professionnel ?",
      "Quand as-tu eu envie de tout abandonner ? Qu'est-ce qui t'a fait continuer ?",
      "Quelle critique t'a le plus blessé — et avait-elle raison ?"
    ]},
    { title: "Ta voix", prompts: [
      "Quels mots ou expressions utilises-tu souvent ? Lesquels détestes-tu ?",
      "Comment parles-tu à un ami, par rapport à un client ? Y a-t-il une différence ?",
      "Quelles blagues ou private jokes reviennent souvent dans ta vie ?"
    ]},
    { title: "Ton quotidien", prompts: [
      "À quoi ressemble une journée type pour toi ?",
      "Quels sont tes rituels du matin ou du soir ?",
      "Qu'est-ce que tu fais pour te ressourcer, en dehors du travail ?"
    ]},
    { title: "Objections & doutes", prompts: [
      "Quelles objections entends-tu le plus avant qu'une personne travaille avec toi ?",
      "Qu'est-ce qui empêche quelqu'un de te faire confiance au premier abord ?",
      "Que dirais-tu à quelqu'un qui pense « ça ne marchera pas pour moi » ?"
    ]},
    { title: "Argent & valeur", prompts: [
      "Quel est ton rapport à l'argent et au prix de ton travail ?",
      "Pourquoi tes services valent-ils ce qu'ils coûtent ?",
      "As-tu déjà refusé de travailler avec quelqu'un ? Pourquoi ?"
    ]}
  ];

  var STORAGE_KEY = "devoilement-french-ken-v1";
  var app = document.getElementById("app");
  var toastEl = document.getElementById("toast");

  var state = loadState();

  function loadState() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        if (parsed && Array.isArray(parsed.answers)) {
          if (typeof parsed.delivered !== "boolean") parsed.delivered = false;
          return parsed;
        }
      }
    } catch (e) {}
    return { started: false, name: "", answers: [], index: 0, finished: false, delivered: false };
  }

  function saveState() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
  }

  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    setTimeout(function () { toastEl.classList.remove("show"); }, 1800);
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function filenameSafe() {
    return state.name ? state.name.toLowerCase().replace(/\s+/g, "-") : "french-ken";
  }

  function render() {
    if (!state.started) return renderIntro();
    if (state.finished) return renderSummary();
    return renderChat();
  }

  function renderIntro() {
    app.innerHTML =
      '<div class="screen">' +
        '<div class="eyebrow">French Ken — questionnaire de marque</div>' +
        '<h1>Dévoilement</h1>' +
        '<p>Vingt étapes pour raconter ton histoire, ta mission et ta philosophie — la matière première de ta marque. Réponds à ton rythme, avec sincérité plutôt qu\'avec perfection. Tu peux écrire ou dicter tes réponses à la voix.</p>' +
        '<div class="meta-row">' +
          '<div class="meta-item"><span class="dot"></span>20 étapes</div>' +
          '<div class="meta-item"><span class="dot"></span>~25–40 minutes</div>' +
          '<div class="meta-item"><span class="dot"></span>Sauvegarde automatique</div>' +
        '</div>' +
        '<div class="name-field">' +
          '<label for="nameInput">Ton prénom (optionnel)</label>' +
          '<input id="nameInput" type="text" placeholder="Michel" value="' + escapeHtml(state.name) + '" />' +
        '</div>' +
        '<div class="actions"><button class="btn-primary" id="startBtn">Commencer →</button></div>' +
      '</div>';
    document.getElementById("startBtn").addEventListener("click", function () {
      state.name = document.getElementById("nameInput").value.trim();
      state.started = true;
      saveState();
      render();
    });
  }

  function renderChat() {
    var idx = state.index;
    var block = BLOCKS[idx];
    var pct = Math.round((idx / BLOCKS.length) * 100);

    var html = '';
    html += '<div class="head">';
    html += '<div class="head-row"><span class="brand">Dévoi<em>lement</em></span><span class="step-label">Étape ' + (idx + 1) + ' / ' + BLOCKS.length + '</span></div>';
    html += '<div class="bar"><div class="bar-fill" style="width:' + pct + '%"></div></div>';
    html += '</div>';

    html += '<div class="log" id="log">';
    for (var i = 0; i < idx; i++) {
      html += renderBotMsg(BLOCKS[i], i);
      html += renderUserMsg(state.answers[i]);
    }
    html += renderBotMsg(block, idx);
    html += '</div>';

    html += '<div class="dock">';
    html += '<div class="input-wrap">';
    html += '<textarea id="answerInput" placeholder="Écris ou dicte ta réponse ici…" rows="3"></textarea>';
    html += '<button class="mic-btn" id="micBtn" type="button" title="Dicter à la voix">🎤</button>';
    html += '</div>';
    html += '<div class="mic-hint" id="micHint">🎙️ Je t\'écoute…</div>';
    html += '<div class="dock-row">';
    html += '<div class="left">';
    if (idx > 0) html += '<button class="btn-ghost" id="backBtn">← Précédent</button>';
    html += '<button class="btn-ghost" id="skipBtn">Passer cette étape</button>';
    html += '</div>';
    html += '<button class="btn-primary" id="nextBtn" disabled>' + (idx === BLOCKS.length - 1 ? "Terminer" : "Suivant") + ' →</button>';
    html += '</div></div>';

    app.innerHTML = html;

    var log = document.getElementById("log");
    log.scrollTop = log.scrollHeight;

    var textarea = document.getElementById("answerInput");
    var existing = state.answers[idx];
    if (existing && !existing.skipped) textarea.value = existing.text;
    textarea.focus();

    var nextBtn = document.getElementById("nextBtn");
    function refreshBtn() { nextBtn.disabled = textarea.value.trim().length === 0; }
    refreshBtn();
    textarea.addEventListener("input", function () {
      textarea.style.height = "auto";
      textarea.style.height = Math.min(textarea.scrollHeight, 200) + "px";
      refreshBtn();
    });

    setupMic(textarea, document.getElementById("micBtn"), document.getElementById("micHint"), refreshBtn);

    nextBtn.addEventListener("click", function () {
      var val = textarea.value.trim();
      if (!val) return;
      state.answers[idx] = { title: block.title, text: val, skipped: false };
      advance();
    });

    var skipBtn = document.getElementById("skipBtn");
    skipBtn.addEventListener("click", function () {
      state.answers[idx] = { title: block.title, text: "", skipped: true };
      advance();
    });

    var backBtn = document.getElementById("backBtn");
    if (backBtn) {
      backBtn.addEventListener("click", function () {
        state.index = Math.max(0, idx - 1);
        saveState();
        render();
      });
    }

    function advance() {
      if (idx === BLOCKS.length - 1) {
        state.finished = true;
      } else {
        state.index = idx + 1;
      }
      saveState();
      render();
    }
  }

  function setupMic(textarea, micBtn, micHint, refreshBtn) {
    var SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
      micBtn.style.display = "none";
      return;
    }

    var recognition = new SpeechRecognition();
    recognition.lang = "fr-FR";
    recognition.continuous = true;
    recognition.interimResults = true;

    var recording = false;
    var baseText = "";
    var finalTranscript = "";

    recognition.onresult = function (event) {
      var interim = "";
      for (var i = event.resultIndex; i < event.results.length; i++) {
        var transcript = event.results[i][0].transcript;
        if (event.results[i].isFinal) finalTranscript += transcript + " ";
        else interim += transcript;
      }
      var sep = baseText && !/\s$/.test(baseText) ? " " : "";
      textarea.value = (baseText + sep + finalTranscript + interim).trim();
      refreshBtn();
    };

    recognition.onerror = function () {
      stop();
    };
    recognition.onend = function () {
      stop();
    };

    function start() {
      baseText = textarea.value;
      finalTranscript = "";
      recording = true;
      micBtn.classList.add("recording");
      micBtn.textContent = "⏹";
      micHint.classList.add("show");
      try { recognition.start(); } catch (e) { stop(); }
    }

    function stop() {
      if (!recording) return;
      recording = false;
      micBtn.classList.remove("recording");
      micBtn.textContent = "🎤";
      micHint.classList.remove("show");
      try { recognition.stop(); } catch (e) {}
    }

    micBtn.addEventListener("click", function () {
      if (recording) stop(); else start();
    });
  }

  function renderBotMsg(block, i) {
    var items = block.prompts.map(function (p) { return "<li>" + escapeHtml(p) + "</li>"; }).join("");
    return (
      '<div class="msg-bot"><div class="card">' +
      '<span class="block-num">Bloc ' + (i + 1) + '</span>' +
      '<p class="block-title">' + escapeHtml(block.title) + '</p>' +
      '<ul>' + items + '</ul>' +
      '</div></div>'
    );
  }

  function renderUserMsg(answer) {
    if (!answer) return "";
    if (answer.skipped) {
      return '<div class="msg-user"><div class="bubble skipped">Étape passée</div></div>';
    }
    return '<div class="msg-user"><div class="bubble">' + escapeHtml(answer.text) + '</div></div>';
  }

  function buildSummaryText() {
    var lines = [];
    var who = state.name ? state.name : "French Ken";
    lines.push("DÉVOILEMENT — " + who);
    lines.push(new Date().toLocaleDateString("fr-FR"));
    lines.push("");
    state.answers.forEach(function (a, i) {
      if (!a) return;
      lines.push((i + 1) + ". " + a.title.toUpperCase());
      lines.push(a.skipped ? "(étape passée)" : a.text);
      lines.push("");
    });
    return lines.join("\n");
  }

  function renderSummary() {
    var text = buildSummaryText();
    var answeredCount = state.answers.filter(function (a) { return a && !a.skipped; }).length;

    var html = '<div class="screen">';
    html += '<div class="eyebrow">Merci' + (state.name ? ", " + escapeHtml(state.name) : "") + '</div>';
    html += '<h1>C\'est dans la boîte.</h1>';
    html += '<p>' + answeredCount + ' réponses sur ' + BLOCKS.length + '.</p>';
    html += '<div class="delivery-status" id="deliveryStatus"></div>';
    html += '<div class="summary-box">';
    state.answers.forEach(function (a, i) {
      if (!a) return;
      html += '<h3>' + (i + 1) + '. ' + escapeHtml(a.title) + '</h3>';
      html += a.skipped
        ? '<p class="empty">(étape passée)</p>'
        : '<p>' + escapeHtml(a.text) + '</p>';
    });
    html += '</div>';
    html += '<div class="actions">';
    html += '<button class="btn-primary" id="copyBtn">Copier tout</button>';
    html += '<button class="btn-secondary hidden" id="downloadBtn">Télécharger le fichier</button>';
    html += '<button class="btn-secondary" id="editBtn">Revoir mes réponses</button>';
    html += '</div>';
    html += '</div>';

    app.innerHTML = html;

    document.getElementById("copyBtn").addEventListener("click", function () {
      copyText(text);
    });
    document.getElementById("editBtn").addEventListener("click", function () {
      state.finished = false;
      state.index = BLOCKS.length - 1;
      saveState();
      render();
    });

    setupDownload(text);
    updateDeliveryStatus("idle");
    if (!state.delivered) {
      sendToWebhook(text, answeredCount);
    } else {
      updateDeliveryStatus("ok");
    }
  }

  function updateDeliveryStatus(mode) {
    var el = document.getElementById("deliveryStatus");
    if (!el) return;
    el.className = "delivery-status";
    if (mode === "sending") {
      el.classList.add("");
      el.innerHTML = "⏳ Envoi automatique à Pierre…";
    } else if (mode === "ok") {
      el.classList.add("ok");
      el.innerHTML = "✓ Envoyé automatiquement à Pierre";
    } else if (mode === "err") {
      el.classList.add("err");
      el.innerHTML = '⚠️ Envoi automatique impossible — <button id="retryBtn">réessayer</button>, ou utilise Copier / Télécharger ci-dessous';
      var retry = document.getElementById("retryBtn");
      if (retry) {
        retry.addEventListener("click", function () {
          sendToWebhook(buildSummaryText(), state.answers.filter(function (a) { return a && !a.skipped; }).length);
        });
      }
    } else {
      el.innerHTML = "";
    }
  }

  function sendToWebhook(summaryText, answeredCount) {
    updateDeliveryStatus("sending");
    var payload = {
      source: "devoilement-french-ken",
      name: state.name || "French Ken",
      date: new Date().toISOString(),
      answeredCount: answeredCount,
      totalBlocks: BLOCKS.length,
      summaryText: summaryText,
      answers: state.answers.map(function (a, i) {
        return a ? { block: i + 1, title: a.title, text: a.text, skipped: !!a.skipped } : null;
      })
    };

    fetch(WEBHOOK_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    }).then(function (res) {
      if (!res.ok) throw new Error("status " + res.status);
      state.delivered = true;
      saveState();
      updateDeliveryStatus("ok");
    }).catch(function () {
      updateDeliveryStatus("err");
    });
  }

  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () {
        showToast("Copié !");
      }).catch(function () { fallbackCopy(text); });
    } else {
      fallbackCopy(text);
    }
  }

  function fallbackCopy(text) {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); showToast("Copié !"); }
    catch (e) { showToast("Impossible de copier automatiquement"); }
    document.body.removeChild(ta);
  }

  function setupDownload(text) {
    var btn = document.getElementById("downloadBtn");

    function directDownload() {
      btn.classList.remove("hidden");
      btn.addEventListener("click", function () {
        var blob = new Blob([text], { type: "text/plain;charset=utf-8" });
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url;
        a.download = "devoilement-" + filenameSafe() + ".txt";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      });
    }

    if (window.claude && typeof window.claude.use === "function") {
      window.claude.use("downloads").then(function (downloads) {
        if (!downloads) return directDownload();
        btn.classList.remove("hidden");
        btn.addEventListener("click", function () {
          downloads.save({ filename: "devoilement-" + filenameSafe() + ".txt", data: text })
            .then(function () { showToast("Fichier prêt"); })
            .catch(function () {});
        });
      }).catch(directDownload);
    } else {
      directDownload();
    }
  }

  render();
})();
</script>
